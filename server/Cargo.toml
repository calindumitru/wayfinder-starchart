[package]
name = "wayfinder-starchart"
version = "0.1.0"
edition = "2024"
description = "A star-map of wayfinder maps kept as GitHub issues, with buttons that start T3 Code sessions"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
mime_guess = "2"
rand = "0.9"
regex = "1"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
